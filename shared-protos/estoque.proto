syntax = "proto3";

package estoque;

option py_generic_services = true;

// =============================================================================
// Contrato gRPC do servico-estoque
// Referência: docs/arquitetura.md §3.3 e ADR-001
//
// Geração de stubs (os arquivos *_pb2.py são artefatos de build, nunca versionados).
// A partir da RAIZ do repositório:
//   # servico-estoque (os stubs ficam no próprio pacote do serviço)
//   python -m grpc_tools.protoc -I shared-protos \
//       --python_out=servico-estoque --grpc_python_out=servico-estoque \
//       shared-protos/estoque.proto
//   # servico-pedidos (cliente gRPC: os stubs ficam em app/clients/)
//   python -m grpc_tools.protoc -I shared-protos \
//       --python_out=servico-pedidos/app/clients \
//       --grpc_python_out=servico-pedidos/app/clients \
//       shared-protos/estoque.proto
// Os dois Dockerfiles já fazem isso no estágio de build; a suíte
// tests/integracao/ compila este arquivo em tempo de teste (guarda de contrato).
// =============================================================================

service EstoqueService {
  // Verifica disponibilidade e reserva atomicamente o estoque
  rpc CheckAndReserve (ReservaRequest)  returns (ReservaResponse);

  // Libera uma reserva (cancelamento de pedido)
  rpc ReleaseReserva  (ReleaseRequest)  returns (ReleaseResponse);

  // Consulta dados de um item pelo ID
  rpc ConsultarItem   (ItemRequest)     returns (ItemResponse);
}

// -----------------------------------------------------------------------------
// CheckAndReserve
// -----------------------------------------------------------------------------
message ReservaRequest {
  string item_id     = 1; // UUID do item
  int32  quantidade  = 2; // Quantidade a reservar
  string pedido_id   = 3; // UUID do pedido (para registro em movimentacoes)
  string request_uuid = 4; // UUID único da requisição (idempotência)
}

message ReservaResponse {
  bool   sucesso     = 1;
  string status      = 2; // CONFIRMADO | ESTOQUE_INSUFICIENTE | ESTOQUE_BLOQUEADO
  string mensagem    = 3;
}

// -----------------------------------------------------------------------------
// ReleaseReserva
// -----------------------------------------------------------------------------
message ReleaseRequest {
  string item_id    = 1;
  int32  quantidade = 2;
  string pedido_id  = 3;
}

message ReleaseResponse {
  bool   sucesso  = 1;
  string mensagem = 2;
}

// -----------------------------------------------------------------------------
// ConsultarItem
// -----------------------------------------------------------------------------
message ItemRequest {
  string item_id = 1;
}

message ItemResponse {
  string item_id              = 1;
  string nome                 = 2;
  int32  quantidade_disponivel = 3;
  int32  quantidade_reservada  = 4;
}
