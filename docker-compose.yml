services:

  # ---------------------------------------------------------------------------
  # Infraestrutura de dados
  # ---------------------------------------------------------------------------
  # PostgreSQL primário (master). A réplica hot standby está em
  # `postgres-replica` e o bootstrap da replicação em `replicacao-init`.
  postgres:
    image: postgres:16
    entrypoint: ["/bin/bash", "/usr/local/bin/primary-entrypoint.sh"]
    command:
      - postgres
      # --- Replicação física (Sprint 3 / issue #11) ---------------------------
      # wal_level=replica é pré-requisito para enviar WAL a um standby.
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      # Retenção de WAL de segurança (além do slot físico): se a réplica ficar
      # fora por um tempo, ela ainda consegue retomar sem re-clone.
      - -c
      - wal_keep_size=512MB
      # Teto do WAL retido por slot: com a réplica parada por muito tempo, o
      # primário não enche o disco — acima do teto o slot é invalidado e o
      # re-clone é necessário (ver docs/replicacao-postgres.md).
      - -c
      - max_slot_wal_keep_size=2GB
      - -c
      - hot_standby=on
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env (nao versionado)}
      POSTGRES_DB:       postgres  # database padrao; os databases de negocio sao criados pelo init-db.sql
      # Credenciais dos usuarios isolados por servico
      PEDIDOS_DB_PASSWORD:  ${PEDIDOS_DB_PASSWORD:-pedidos_pass}
      ESTOQUE_DB_PASSWORD:  ${ESTOQUE_DB_PASSWORD:-estoque_pass}
      AUTH_DB_PASSWORD:     ${AUTH_DB_PASSWORD:-auth_pass}
      # Credencial do papel de replicação (consumida por replicacao-init)
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicacao_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      # Em volume NOVO, o pg_hba.conf só nasce depois do initdb; este hook roda
      # em seguida e libera a conexão de replicação (ver initdb-replicacao.sh).
      - ./infra/postgres/initdb-replicacao.sh:/docker-entrypoint-initdb.d/10-replicacao.sh:ro
      # Ajusta o pg_hba.conf antes do servidor subir (volumes antigos inclusive).
      - ./infra/postgres/primary-entrypoint.sh:/usr/local/bin/primary-entrypoint.sh:ro
    healthcheck:
      # TCP explícito: durante o initdb de um volume novo o servidor temporário
      # escuta só no socket Unix; um `pg_isready` local passaria cedo demais e
      # liberaria o bootstrap/replica antes de o servidor definitivo subir.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Bootstrap idempotente da replicação: cria o papel `replicator` e o slot
  # físico `caixanamao_replica` no primário. Roda a cada `docker compose up` e
  # termina; a réplica só sobe quando ele conclui com sucesso.
  # ---------------------------------------------------------------------------
  replicacao-init:
    image: postgres:16
    entrypoint: ["/bin/bash", "/infra/bootstrap-replicacao.sh"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env (nao versionado)}
      PGDATABASE: postgres
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicacao_pass}
    volumes:
      - ./infra/replicacao/init-replicacao.sql:/infra/init-replicacao.sql:ro
      - ./infra/replicacao/bootstrap-replicacao.sh:/infra/bootstrap-replicacao.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # PostgreSQL réplica (slave / hot standby), alimentada por streaming
  # replication assíncrona. Somente leitura por construção (recovery).
  # ---------------------------------------------------------------------------
  postgres-replica:
    image: postgres:16
    entrypoint: ["/bin/bash", "/usr/local/bin/replica-entrypoint.sh"]
    command: ["postgres", "-c", "listen_addresses=*"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env (nao versionado)}
      PRIMARY_HOST: postgres
      PRIMARY_PORT: "5432"
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicacao_pass}
      REPLICATION_SLOT: caixanamao_replica
    ports:
      # Loopback apenas: porta de diagnóstico/leitura, não exposta à rede.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./infra/postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
      replicacao-init:
        condition: service_completed_successfully
    healthcheck:
      # Healthy = aceita SQL E continua em recovery (é réplica, não promovida).
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d postgres &&
          [ "$$(psql -U "$${POSTGRES_USER}" -d postgres -tAc 'SELECT pg_is_in_recovery()')" = "t" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # LocalStack — emulação de AWS SQS para desenvolvimento local (ADR-005)
  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs
      DEFAULT_REGION: us-east-1
      DEBUG: 0
    volumes:
      - localstack_data:/var/lib/localstack

  # ---------------------------------------------------------------------------
  # Microsservicos — descomentados na Sprint 2
  # ---------------------------------------------------------------------------

  servico-pedidos:
    build:
      # Contexto na raiz porque o build gera os stubs a partir de
      # shared-protos/estoque.proto (ver servico-pedidos/Dockerfile).
      context: .
      dockerfile: servico-pedidos/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Driver async (asyncpg): é o que a aplicação usa (app/db.py).
      DATABASE_URL: postgresql+asyncpg://pedidos_user:${PEDIDOS_DB_PASSWORD:-pedidos_pass}@postgres:5432/pedidos_db
      ESTOQUE_GRPC_HOST: servico-estoque
      ESTOQUE_GRPC_PORT: 50051
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      AWS_ENDPOINT_URL: http://localstack:4566
      SQS_QUEUE_PEDIDOS: caixanamao-pedidos-criados
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # O bloco do servico-estoque é habilitado pela PR #27 (Sprint 2 / Issue #6):
      # enquanto ela não estiver em `dev`, este compose referencia um serviço que
      # ainda não existe (o Docker Compose recusa o projeto inteiro). **Ordem de
      # merge: #27 antes de #26** — ou as duas juntas.
      servico-estoque:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  servico-estoque:
    build:
      # Contexto na raiz porque o build gera os stubs a partir de
      # shared-protos/estoque.proto (ver servico-estoque/Dockerfile).
      context: .
      dockerfile: servico-estoque/Dockerfile
    ports:
      - "50051:50051"
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql+asyncpg://estoque_user:${ESTOQUE_DB_PASSWORD:-estoque_pass}@postgres:5432/estoque_db
      REDIS_URL: redis://redis:6379/0
      LOCK_TTL_SECONDS: ${LOCK_TTL_SECONDS:-5}
      AWS_ENDPOINT_URL: http://localstack:4566
      SQS_QUEUE_ESTOQUE: caixanamao-estoque-atualizado
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/health').status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # servico-autenticacao:
  #   build:
  #     context: ./servico-autenticacao
  #     dockerfile: Dockerfile
  #   ports:
  #     - "8001:8001"
  #   environment:
  #     DATABASE_URL: postgresql://auth_user:${AUTH_DB_PASSWORD:-auth_pass}@postgres:5432/autenticacao_db
  #     JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
  #     JWT_ALGORITHM: HS256
  #     ACCESS_TOKEN_EXPIRE_MINUTES: 15
  #     REFRESH_TOKEN_EXPIRE_DAYS: 7
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

# ---------------------------------------------------------------------------
# Volumes persistentes
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
  postgres_replica_data:
  localstack_data:
