services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: caixanamao
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

