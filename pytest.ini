[pytest]
# Suíte de INTEGRAÇÃO entre serviços (issue #7): Pedidos (REST) <-> Estoque (gRPC).
# A suíte é black-box e se auto-pula quando a stack não está no ar — veja
# tests/integracao/README.md.
#
# Os testes de cada serviço continuam com o seu próprio pytest.ini: rodar
# `pytest` dentro de servico-<x>/ usa a configuração mais próxima do diretório.
testpaths = tests/integracao
markers =
    integracao: exige a stack no ar (servico-pedidos + servico-estoque + PostgreSQL)
addopts = -ra --strict-markers
